project:
  type: website
  render:
    - "*.qmd"
    - "news/*.qmd"
    - "jobs/*.qmd"

website:
  title: "IceDaM"
  description: "Ice Shelf Damage Characterization and Monitoring around Antarctica — an ERC Starting Grant project."
  site-url: https://ercicedam.github.io
  favicon: images/icedam-icon.png
  navbar:
    logo: images/icedam-icon.png
    logo-alt: "IceDaM logo"
    right:
      - text: Project
        href: project.qmd
      - text: Team
        href: team.qmd
      - text: Publications
        href: publications.qmd
      - text: Media
        href: media.qmd
